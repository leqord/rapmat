# Dev-only Alembic config for autogenerate against a scratch database.
# The app never reads this file: migrations run programmatically at
# store construction (rapmat/storage/engine.py).
#
# Usage:
#   alembic upgrade head                 # against sqlalchemy.url below
#   alembic revision --autogenerate -m "..."

[alembic]
script_location = rapmat/storage/migrations

# Point at a scratch file when autogenerating; never at a real database.
sqlalchemy.url = sqlite:///./_alembic_scratch.sqlite

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
